[package]
name = "krmf"
version = "0.1.0"
description = "A Mac-first lifestyle app"
edition = "2021"

[lib]
name = "krmf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1" 

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
